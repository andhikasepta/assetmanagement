# Redis Configuration Snippet for Session Control (VM 103.123.100.11)
# Location: /etc/redis/redis.conf

# Bind to localhost and VM private/public IP
bind 127.0.0.1 103.123.100.11

# Port
port 6379

# Protected mode (set to no since binding to specific interface with password)
protected-mode no

# Require password
requirepass password_redis_rahasia

# Memory management & eviction for session cache
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (RDB snapshots)
save 900 1
save 300 10
save 60 10000

# TCP keepalive
tcp-keepalive 300
