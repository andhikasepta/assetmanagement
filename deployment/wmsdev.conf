<VirtualHost *:80>
    ServerName wmsdev.my.id
    ServerAlias 5wmsdev.my.id localhost 103.123.100.13

    ProxyPreserveHost Off
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Otomatis ubah setiap header redirect 'http://' menjadi 'https://' agar tidak loop
    Header edit Location ^http:// https://


    # =========================================================================
    # 1. Forward ke Container AWan (Port 8081 VM-Docker)
    # =========================================================================
    ProxyPass /awan/ http://103.123.100.12:8081/ retry=0 timeout=60
    ProxyPassReverse /awan/ http://103.123.100.12:8081/
    ProxyPass /awan http://103.123.100.12:8081 retry=0 timeout=60
    ProxyPassReverse /awan http://103.123.100.12:8081
    ProxyPassReverse /awan https://wmsdev.my.id/awan

    # =========================================================================
    # 2. Redirect Legacy Path /amora ke Subdomain https://amora.wmsdev.my.id/
    # =========================================================================
    Redirect permanent /amora https://amora.wmsdev.my.id/
    Redirect permanent /amora/ https://amora.wmsdev.my.id/

    # =========================================================================
    # 3. Forward ke Container WMS (Port 8080 VM-Docker)
    # =========================================================================
    ProxyPass / http://103.123.100.12:8080/ retry=0 timeout=60
    ProxyPassReverse / http://103.123.100.12:8080/
    ProxyPassReverse / https://wmsdev.my.id/

    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 103.123.100.12

    ErrorLog ${APACHE_LOG_DIR}/wms_error.log
    CustomLog ${APACHE_LOG_DIR}/wms_access.log combined
</VirtualHost>
